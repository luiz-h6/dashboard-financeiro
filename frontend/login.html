<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl - Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: { 800: '#0f172a', 900: '#020617' }, 'neon-cyan': '#06b6d4' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-slate-300 font-sans h-screen flex items-center justify-center">

    <div class="bg-navy-800 p-8 rounded-xl border border-slate-700/50 shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-wider mb-2">FIN<span class="text-neon-cyan">CONTROL</span></h1>
            <p class="text-sm text-slate-400">Acesso Restrito</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full bg-navy-900 border border-slate-700 rounded-md p-2.5 text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
                <input type="password" id="password" required class="w-full bg-navy-900 border border-slate-700 rounded-md p-2.5 text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan" placeholder="••••••••">
            </div>
            
            <button type="submit" id="btnSubmit" class="w-full py-3 bg-neon-cyan text-navy-900 font-bold rounded-lg hover:bg-cyan-400 transition shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                Entrar no Painel
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <p class="text-slate-500">Ainda não tem conta? <button onclick="toggleMode()" class="text-neon-cyan hover:underline">Registrar-se</button></p>
        </div>

        <form id="registerForm" class="space-y-6 hidden mt-4">
            <div class="border-t border-slate-700 pt-6">
                <h3 class="text-lg font-bold text-white mb-4">Criar nova conta</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nome Completo</label>
                        <input type="text" id="regName" required class="w-full bg-navy-900 border border-slate-700 rounded-md p-2.5 text-white focus:outline-none focus:border-neon-cyan" placeholder="João da Silva">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                        <input type="email" id="regEmail" required class="w-full bg-navy-900 border border-slate-700 rounded-md p-2.5 text-white focus:outline-none focus:border-neon-cyan" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Senha Segura</label>
                        <input type="password" id="regPassword" required class="w-full bg-navy-900 border border-slate-700 rounded-md p-2.5 text-white focus:outline-none focus:border-neon-cyan" placeholder="••••••••">
                    </div>
                    <button type="submit" id="btnRegister" class="w-full py-3 bg-emerald-500 text-navy-900 font-bold rounded-lg hover:bg-emerald-400 transition shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                        Criar Conta
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const API_BASE = '/api';

        // Redireciona se já estiver logado
        if(localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        function toggleMode() {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            if (regForm.classList.contains('hidden')) {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
            } else {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.textContent = 'Autenticando...';
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.user.name);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Erro ao entrar');
                }
            } catch(err) {
                alert('Erro de conexão com o servidor');
            } finally {
                btn.textContent = 'Entrar no Painel';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            btn.textContent = 'Registrando...';
            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if(res.ok) {
                    alert('Conta criada com sucesso! Faça o login agora.');
                    toggleMode();
                    document.getElementById('email').value = document.getElementById('regEmail').value;
                } else {
                    alert(data.error || 'Erro ao registrar');
                }
            } catch(err) {
                alert('Erro de conexão com o servidor');
            } finally {
                btn.textContent = 'Criar Conta';
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>

</body>
</html>
